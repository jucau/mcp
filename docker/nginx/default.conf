map $request_uri $is_mcp {
    ~^/(mcp|\.well-known/oauth|oauth/)  1;
    default 0;
}

map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}

log_format mcp '$time_iso8601 $status $request_method $request_path version=$http_mcp_protocol_version method=$http_mcp_method name=$http_mcp_name';

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    access_log /var/log/nginx/mcp.log mcp if=$is_mcp;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
